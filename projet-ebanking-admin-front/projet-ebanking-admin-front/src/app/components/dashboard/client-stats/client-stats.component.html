<div class="detail-card">
  <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-3">
    <div class="d-flex align-items-center gap-2">
      <i class="bi bi-bar-chart-line fs-4 text-primary"></i>
      <h4 class="mb-0">{{ 'clientRegistrations.title' | translate }}</h4>
    </div>

    <div class="d-flex align-items-center gap-2">
      <select class="form-select form-select-sm w-auto custom-select" [(ngModel)]="filter" (change)="onFilterChange()">
        <option value="month">{{ 'clientRegistrations.monthly' | translate }}</option>
        <option value="year">{{ 'clientRegistrations.yearly' | translate }}</option>
      </select>

      <select class="form-select form-select-sm w-auto custom-select" [(ngModel)]="limit" (change)="onFilterChange()">
        <option *ngFor="let n of availableLimits" [ngValue]="n">
          {{ getLastPeriodsLabel(n) }}
        </option>

      </select>
    </div>
  </div>

  <div class="chart-wrapper" style="height: 360px;">
    <canvas baseChart
            [data]="barChartData"
            [options]="barChartOptions"
            [type]="barChartType">
    </canvas>
  </div>
</div>
