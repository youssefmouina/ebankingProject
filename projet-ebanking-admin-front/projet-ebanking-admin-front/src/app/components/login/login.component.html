<div class="container d-flex justify-content-center align-items-center vh-100">
  <div class="card custom-card p-4 shadow-sm" style="width: 100%; max-width: 400px;">
    <h2 class="text-center mb-4 fw-bold">Employee Login</h2>

    <form (ngSubmit)="login()">
      <div class="mb-3">
        <label for="username" class="form-label fw-semibold">Email</label>
        <input type="text" [(ngModel)]="credentials.email" name="username" id="username" class="form-control" required />
      </div>

      <div class="mb-3">
        <label for="password" class="form-label fw-semibold">Password</label>
        <input type="password" [(ngModel)]="credentials.password" name="password" id="password" class="form-control" required />
      </div>

      <button type="submit" class="btn btn-primary w-100 fw-semibold">Login</button>

      <div *ngIf="errorMessage" class="alert alert-danger mt-3 p-2 text-center">
        {{ errorMessage }}
      </div>
    </form>
  </div>
</div>
